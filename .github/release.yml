# Sorts merged pull requests into sections when GitHub generates release notes.
# Label each PR (enhancement, bug, documentation); unlabelled PRs land in "Other changes".
changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
  categories:
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Accessibility
      labels: [accessibility]
    - title: Docs
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
