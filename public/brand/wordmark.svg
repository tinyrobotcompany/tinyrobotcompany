<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 96" width="640" height="96" role="img" aria-label="tinyrobotcompany">
  <!-- The wordmark is text-based so it swaps colour via `color` on the parent element. -->
  <text x="0" y="70"
        font-family="Geist, Söhne, Inter, ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-size="80"
        font-weight="500"
        letter-spacing="-3.5"
        fill="currentColor">
    <tspan opacity="0.55">tiny</tspan><tspan font-weight="600" opacity="1">robot</tspan><tspan opacity="0.55">company</tspan><tspan fill="#DE3A2A">.</tspan>
  </text>
</svg>
