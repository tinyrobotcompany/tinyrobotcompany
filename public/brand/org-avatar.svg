<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="1024" height="1024" role="img" aria-label="Tiny Robot Company">
  <defs>
    <radialGradient id="halo" cx="50%" cy="56%" r="55%">
      <stop offset="0"   stop-color="#DE3A2A" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#DE3A2A" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#DE3A2A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark ground fills the whole square; GitHub crops it to a circle -->
  <rect width="240" height="240" fill="#0A0A0A"/>
  <!-- Soft red halo behind the character for depth -->
  <circle cx="120" cy="132" r="118" fill="url(#halo)"/>

  <!-- Antenna: stem + beacon -->
  <line x1="120" y1="34" x2="120" y2="62" stroke="#DE3A2A" stroke-width="7" stroke-linecap="round"/>
  <circle cx="120" cy="26" r="9" fill="#FBEEDA"/>
  <circle cx="120" cy="26" r="9" fill="none" stroke="#A6281B" stroke-width="1.5" opacity="0.4"/>

  <!-- Head -->
  <rect x="30" y="58" width="180" height="158" rx="46" fill="#DE3A2A"/>
  <!-- Subtle top-left highlight for form -->
  <ellipse cx="60" cy="88" rx="16" ry="10" fill="#FFFFFF" opacity="0.09"/>
  <!-- Subtle right-side shadow for form -->
  <path d="M 178 82 Q 190 138 178 196 L 188 196 Q 200 138 188 82 Z" fill="#000000" opacity="0.08"/>

  <!-- Happy face: closed-eye smile -->
  <path d="M 58 148 Q 80 112 102 148" stroke="#0F0F10" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M 138 148 Q 160 112 182 148" stroke="#0F0F10" stroke-width="9" stroke-linecap="round" fill="none"/>
  <ellipse cx="48" cy="174" rx="10" ry="6" fill="#A6281B" opacity="0.55"/>
  <ellipse cx="192" cy="174" rx="10" ry="6" fill="#A6281B" opacity="0.55"/>
  <path d="M 108 184 Q 120 194 132 184" stroke="#0F0F10" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
